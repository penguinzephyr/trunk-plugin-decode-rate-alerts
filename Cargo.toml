[package]
# Your plugin's id: lowercase letters, digits and dashes. It names the
# executable, the release files and the plugin's entry in the registry.
name = "pushover-notifications"
version = "0.1.0"
edition = "2024"
description = "Decode-rate notifications for Trunk Recorder Pro"
license = "MIT"
repository = "https://github.com/penguinzephyr/trunk-plugin-pushover-alert"
authors = ["Penguinzephyr"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.5.0"
# The settings form is drawn from your config structs' JSON Schema. Keep the
# major version the SDK uses (1).
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
ureq = { version = "3", features = ["json"] }

[profile.release]
strip = true
lto = true
